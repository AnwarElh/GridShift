name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un déploiement à la fois. On ne coupe pas celui en cours : une mise en ligne
# à moitié faite est pire qu'une mise en ligne en retard.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, pas 20 : `npm test` passe par --experimental-test-module-mocks,
          # arrivé en 22.3. Sur 20, node refuse l'option avant d'avoir lu un
          # seul test, et le déploiement s'arrêtait là — sur une suite qui
          # passe en local.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Le contenu avant le code : si l'export refuse de passer — un auteur
      # inconnu, une traduction manquante, un visuel sans crédit — le
      # déploiement s'arrête ici plutôt que de publier une base incohérente.
      - name: Check content
        run: npm run content:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}

      # Le contenu et les médias sont poussés avant le worker : une page servie
      # par le nouveau code doit trouver ses données et ses images en place, pas
      # l'inverse.
      - name: Migrate and seed D1
        run: |
          npx wrangler d1 migrations apply autnic-content --remote
          npm run db:seed:remote
        env:
          # Le compte est nommé dans wrangler.jsonc ; il ne reste que le jeton.
          # Les deux noms sont acceptés : le dépôt le tient sous `CLOUDFLARE`,
          # et GitHub ne sait pas renommer un secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}

      - name: Push media to R2
        run: |
          npm run media:push:remote
          node scripts/media-build.mjs --push --remote
        env:
          # Le compte est nommé dans wrangler.jsonc ; il ne reste que le jeton.
          # Les deux noms sont acceptés : le dépôt le tient sous `CLOUDFLARE`,
          # et GitHub ne sait pas renommer un secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          # Le compte est nommé dans wrangler.jsonc ; il ne reste que le jeton.
          # Les deux noms sont acceptés : le dépôt le tient sous `CLOUDFLARE`,
          # et GitHub ne sait pas renommer un secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
